g:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.box{width:20px;height:20px;border:2px solid #cfd4df;border-radius:7px;flex:none}.store{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0}.storetop{display:flex;justify-content:space-between;gap:10px}.storetitle{font-weight:900}.distance{color:var(--accent);font-weight:850;white-space:nowrap}.storemeta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}.storelinks{display:flex;gap:8px;margin-top:10px}.storelinks a{flex:1;text-align:center;text-decoration:none;background:var(--soft);color:var(--accent);padding:9px;border-radius:12px;font-weight:800;font-size:12px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:22px 0;line-height:1.5}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);display:flex;justify-content:center;z-index:10}.navin{width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;padding:7px 2px}.nav button.active{color:var(--accent)}.navico{display:block;font-size:20px;margin-bottom:2px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#182033;color:#fff;padding:10px 14px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 11px;font-weight:800}.pill.active{background:var(--soft);border-color:var(--accent);color:var(--accent)}.mapnote{font-size:11px;color:var(--muted);line-height:1.45;margin-top:12px}

body{background:radial-gradient(circle at 50% -10%,#eef0ff 0,#f6f7fb 38%,#f5f6fb 70%)}

.brand{letter-spacing:-.02em}.langbtn{box-shadow:0 4px 14px rgba(30,40,70,.05)}

<body>
<div class="app">
  <div class="top"><div><div class="brand">🥗 Food Planner</div><div class="hello" id="hello"></div></div><button class="langbtn" onclick="openLanguage()" id="langBtn">🌍 RU</button></div>

  <section id="home" class="screen active">
    <div class="hero"><div class="eyebrow">FOOD PLANNER</div><div class="title" id="homeTitle"></div><p class="sub" id="homeSub"></p></div>
    <div class="installbar" id="installBar"><span>📲</span><div class="installtxt" id="installText">Установи Food Planner на устройство — будет открываться как приложение.</div><button class="smallbtn" id="installBtn" onclick="installApp()">Установить</button></div>
    <div class="section" id="mySection"></div><div class="grid">
      <button class="card big" onclick="go('today')"><div class="icon">📅</div><div class="ct" data-i18n="today"></div><div class="cm" data-i18n="todayDesc"></div></button>
      <button class="card" onclick="go('week')"><div class="icon">📆</div><div class="ct" data-i18n="week"></div><div class="cm" data-i18n="weekDesc"></div></button>
      <button class="card" onclick="go('shopping')"><div class="icon">🛒</div><div class="ct" data-i18n="shopping"></div><div class="cm" data-i18n="shoppingDesc"></div></button>
      <button class="card" onclick="go('stores')"><div class="icon">📍</div><div class="ct" data-i18n="stores"></div><div class="cm" data-i18n="storesDesc"></div></button>
      <button class="card" onclick="go('replace')"><div class="icon">🔄</div><div class="ct" data-i18n="replace"></div><div class="cm" data-i18n="replaceDesc"></div></button>
      <button class="card" onclick="go('favorites')"><div class="icon">❤️</div><div class="ct" data-i18n="favorites"></div><div class="cm" data-i18n="favoritesDesc"></div></button>
      <button class="card" onclick="go('ai')"><div class="icon">🤖</div><div class="ct" data-i18n="ai"></div><div class="cm" data-i18n="aiDesc"></div></button>
      <button class="card" onclick="go('nutrition')"><div class="icon">📊</div><div class="ct" data-i18n="nutrition"></div><div class="cm" data-i18n="nutritionDesc"></div></button>
      <button class="card" onclick="go('calories')"><div class="icon">🧮</div><div class="ct" data-i18n="calories"></div><div class="cm" data-i18n="caloriesDesc"></div></button>
      <button class="card" id="goalsCard" onclick="go('goals')"><div class="icon">🎯</div><div class="ct" data-i18n="goals"></div><div class="cm" data-i18n="goalsDesc"></div></button>
      <button class="card" onclick="startOnboarding(true)"><div class="icon">⚙️</div><div class="ct" data-i18n="profile"></div><div class="cm" data-i18n="profileDesc"></div></button>
    </div>
    <button class="primary" onclick="syncToBot()" data-i18n="saveBot"></button>
    <div class="footer" id="footer"></div>
  </section>

  <section id="today" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="today"></div><p class="sub" id="todaySub"></p><div id="todayMeals"></div></section>
  <section id="week" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="week"></div><p class="sub" id="weekSub"></p><div id="weekMeals"></div></section>
  <section id="shopping" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="shopping"></div><p class="sub" id="shoppingSub"></p><div class="shopping" id="shoppingList"></div></section>

  <section id="stores" class="screen">
    <button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="stores"></div><p class="sub" data-i18n="storesIntro"></p>
    <div class="pillrow" id="radiusRow"></div>
    <button class="primary" onclick="findStoresByLocation()" data-i18n="useLocation"></button>
    <div class="section" data-i18n="orAddress"></div>
    <input class="input" id="addressInput" data-i18n-placeholder="addressPlaceholder">
    <button class="secondary" onclick="findStoresByAddress()" data-i18n="searchAddress"></button>
    <div id="storeStatus" class="hint"></div><div id="storeResults"></div>
    <div class="mapnote">© OpenStreetMap contributors. Магазины показываются по открытым данным OpenStreetMap. Поиск выполняется только после вашего действия.</div>
  </section>

  <section id="replace" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="replace"></div><p class="sub" data-i18n="replaceIntro"></p><div id="replaceList"></div></section>
  <section id="favorites" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="favorites"></div><div id="favoritesList"></div></section>
  <section id="ai" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="ai"></div><div class="info" data-i18n="aiInfo"></div><button class="primary" onclick="send('ai')" data-i18n="openAiBot"></button></section>
  <section id="nutrition" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="nutrition"></div><div class="info" data-i18n="nutritionInfo"></div></section>
  <section id="calories" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="calories"></div><p class="sub" data-i18n="caloriesIntro"></p><div id="calorieForm"></div><div id="calorieResult"></div></section>
  <section id="goals" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="goals"></div><p class="sub" id="goalsIntro"></p><div id="goalsContent"></div></section>

  <section id="onboarding" class="screen"><div class="eyebrow">FOOD PLANNER</div><div class="title" id="onTitle"></div><div class="progress"><i id="progress"></i></div><div id="question"></div></section>
  <section id="language" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="languageTitle"></div><p class="sub" data-i18n="languageSub"></p><div id="languageChoices" class="choices"></div></section>
</div>

<div id="nav" class="nav"><div class="navin"><button id="n-home" onclick="go('home')"><span class="navico">🏠</span><span data-i18n="navHome"></span></button><button id="n-today" onclick="go('today')"><span class="navico">📅</span><span data-i18n="navToday"></span></button><button id="n-shopping" onclick="go('shopping')"><span class="navico">🛒</span><span data-i18n="navShop"></span></button><button id="n-stores" onclick="go('stores')"><span class="navico">📍</span><span data-i18n="navStores"></span></button></div></div>

function prefOptions(key){return MEAL_PREFS[key]||[]}
function prefAllowedDish(key,d){const prefs=profile?.mealPrefs?.[key]||[];const custom=profile?.mealPrefsCustom?.[key]||[];if(!prefs.length&&!custom.length)return true;const x=norm(d);const hit=prefs.some(pr=>(PREF_KEYWORDS[pr]||[]).some(k=>x.includes(norm(k))));if(hit)return true;return custom.some(text=>{const words=norm(text).split(/[^a-zа-я0-9]+/).filter(w=>w.length>=4);return words.some(w=>x.includes(w))})}
function ageScore(d){const a=Number(profile.age||30);const x=norm(d);if(a>=60){if(/омлет|рыб|картоф|чечевиц|греч|йогурт|творог|рис/.test(x))return 3;if(/макарон|бутерброд/.test(x))return 0}if(a<=12){if(/овсян|рис|греч|банан|йогурт|картоф|макарон/.test(x))return 3}if(a>=13&&a<=17){if(/овсян|греч|рис|куриц|рыб|чечевиц|овощ/.test(x))return 2}return 1}
function pick(arr,used,key){let options=arr.filter(x=>allowed(x)&&!used.has(x));if(!options.length)options=arr.filter(allowed);if(!options.length)return 'Подходящий вариант не найден';const preferred=options.filter(x=>prefAllowedDish(key,x));if(preferred.length)options=preferred;options.sort((a,b)=>ageScore(b)-ageScore(a));const top=options.slice(0,Math.min(3,options.length));return top[Math.floor(Math.random()*top.length)]}
function buildPlan(){const used=new Set();return (profile.meals||[]).map(key=>{const dish=pick(dishes[key]||[],used,key);used.add(dish);return {key,dish}})}

function renderToday(){if(!profile?.plan?.length){document.getElementById('todayMeals').innerHTML=`<div class="info">${t('noPlan')}</div>`;return}document.getElementById('todaySub').textContent=t('todaySub');const adult=Number(profile.age||0)>=18;let total=0;const cards=profile.plan.map((x,i)=>{const kcal=dishKcal(x.dish);if(adult)total+=kcal;return `<div class="meal"><div class="mealhead"><span>${labels[x.key]?.[0]||''} ${labelMeal(x.key)}</span><span class="badge">${i===0?'':labelMeal(x.key)}</span></div><div class="dishname">${escapeHtml(dishText(x.dish))}</div>${adult&&kcal?`<div class="calmeal"><span>🔥 Калорийность блюда</span><span class="kcal">≈ ${kcal} ккал</span></div>`:''}<div class="portionbox"><b>⚖️ ${t('portion')}</b><br>${escapeHtml(portions[x.dish]||'—')}</div><button class="smallbtn" onclick="toggleFavorite(${i})">♡</button><button class="smallbtn" onclick="replaceDish(${i})">🔄</button></div>`}).join('');document.getElementById('todayMeals').innerHTML=cards+(adult?`<div class="daytotal">🔥 Итого за день: ≈ ${total} ккал</div>`:'')}
function renderWeek(){document.getElementById('weekSub').textContent=t('weekSub');if(!profile?.meals?.length){document.getElementById('weekMeals').innerHTML=`<div class="info">${t('noPlan')}</div>`;return}let html='';const days=lang==='ru'?['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье']:lang==='en'?['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:lang==='nl'?['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag']:['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];const used=[];for(let day=0;day<7;day++){html+=`<div class="weekday">${days[day]}</div><div class="meal">`;for(const key of profile.meals||[]){let opts=(dishes[key]||[]).filter(allowed).filter(x=>!used.slice(-3).includes(x));if(!opts.length)opts=(dishes[key]||[]).filter(allowed);const dish=opts.length?opts[(day+key.length+Number(profile.age||0))%opts.length]:'Подходящий вариант не найден';used.push(dish);html+=`${labels[key][0]} ${labelMeal(key)} · ${escapeHtml(dishText(dish))}<br>`}html+='</div>'}document.getElementById('weekMeals').innerHTML=html}

async function findStoresByLocation(){
  const use=(lat,lon)=>findStores(Number(lat),Number(lon));
  if(tg?.LocationManager){
    try{
      const lm=tg.LocationManager;
      lm.init(()=>{
        if(lm.isLocationAvailable){
          lm.getLocation(loc=>{if(loc)use(loc.latitude,loc.longitude);else toast(t('locationDenied'))});
        }else if(navigator.geolocation){
          navigator.geolocation.getCurrentPosition(pos=>use(pos.coords.latitude,pos.coords.longitude),()=>toast(t('locationDenied')),{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
        }else toast(t('locationDenied'));
      });
      return;
    }catch(e){}
  }
  if(!navigator.geolocation){toast(t('locationDenied'));return}
  navigator.geolocation.getCurrentPosition(pos=>use(pos.coords.latitude,pos.coords.longitude),()=>toast(t('locationDenied')),{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
}
async function fetchJson(url,timeoutMs=12000){
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{const r=await fetch(url,{signal:controller.signal,headers:{'Accept':'application/json'}}); if(!r.ok)throw new Error(String(r.status)); return await r.json();}
  finally{clearTimeout(timer)}
}
async function geocodeAddress(q){
  // Photon is used first because it is designed as an OSM geocoder; Nominatim is a fallback.
  const photon='https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=1&lang='+encodeURIComponent(lang);
  try{const d=await fetchJson(photon,10000);const f=d?.features?.[0];if(f?.geometry?.coordinates?.length>=2)return [Number(f.geometry.coordinates[1]),Number(f.geometry.coordinates[0])];}catch(e){}
  const nom='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q)+'&accept-language='+encodeURIComponent(lang);
  try{const d=await fetchJson(nom,10000);if(d?.[0])return [Number(d[0].lat),Number(d[0].lon)];}catch(e){}
  return null;
}
async function findStoresByAddress(){
  const q=document.getElementById('addressInput').value.trim();if(!q){toast(t('addressError'));return}
  setStoreStatus(t('finding'));document.getElementById('storeResults').innerHTML='';
  try{const coords=await geocodeAddress(q);if(!coords){toast(t('addressError'));setStoreStatus('');return}await findStores(coords[0],coords[1]);}
  catch(e){setStoreStatus(t('osmError'));toast(t('osmError'))}
}
const OVERPASS_ENDPOINTS=['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const storeCache=new Map();
async function fetchOverpass(endpoint,q,timeoutMs=18000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);try{const body='data='+encodeURIComponent(q);const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','Accept':'application/json'},body,signal:controller.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function findStores(lat,lon){
  lat=Number(lat);lon=Number(lon);if(!Number.isFinite(lat)||!Number.isFinite(lon)){toast(t('locationDenied'));return}
  const cacheKey=[lat.toFixed(4),lon.toFixed(4),radius].join(':');const cached=storeCache.get(cacheKey);
  if(cached&&Date.now()-cached.time<300000){renderStores(cached.stores,lat,lon);return}
  setStoreStatus(t('finding'));document.getElementById('storeResults').innerHTML='';
  const q=`[out:json][timeout:12];(nwr[shop~"^(supermarket|convenience|greengrocer|bakery|deli)$"](around:${radius*1000},${lat},${lon}););out center tags;`;
  let lastError=null;
  for(const endpoint of OVERPASS_ENDPOINTS){
    try{
      const data=await fetchOverpass(endpoint,q,18000);
      const stores=(data.elements||[]).map(x=>{const la=x.lat??x.center?.lat,lo=x.lon??x.center?.lon;if(la==null||lo==null)return null;return {name:x.tags?.name||x.tags?.brand||'Store',type:x.tags?.shop||'',lat:Number(la),lon:Number(lo),distance:distanceKm(lat,lon,Number(la),Number(lo))}}).filter(Boolean).filter(x=>x.distance<=radius+0.05).sort((a,b)=>a.distance-b.distance).slice(0,20);
      storeCache.set(cacheKey,{time:Date.now(),stores});renderStores(stores,lat,lon);return;
    }catch(e){lastError=e}
  }
  setStoreStatus(t('osmError'));toast(t('osmError'));console.warn('store search failed',lastError);
}

function calculateCalories(){const age=Number(profile?.age||0);if(!age||age<18){renderCalories();return}const sex=(document.getElementById('cSex').value||'').toLowerCase();const w=Number(document.getElementById('cWeight').value),h=Number(document.getElementById('cHeight').value),a=Number(document.getElementById('cActivity').value);if(!w||!h||!a||!['м','ж','m','f','male','female'].some(x=>sex.startsWith(x))){toast(t('calorieInputError'));return}const bmr=(sex.startsWith('м')||sex.startsWith('m'))?(10*w+6.25*h-5*age+5):(10*w+6.25*h-5*age-161);const total=Math.round(bmr*a);document.getElementById('calorieResult').innerHTML=`<div class="meal"><div class="dishname">${t('calorieResult')}</div><div class="title" style="font-size:28px">≈ ${total} kcal/day</div><div class="hint">${t('calorieResultNote')}</div></div>`}

function send(action,data){if(tg){tg.sendData(JSON.stringify({action,...(data?{profile:data}:{})}));}else toast('Open inside Telegram')}
function toast(x){const el=document.getElementById('toast');el.textContent=x;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;document.getElementById('installBar')?.classList.remove('hidden')});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;document.getElementById('installBar')?.classList.add('hidden')});function installApp(){if(!deferredInstallPrompt){toast(lang==='ru'?'Открой меню браузера и выбери «Установить приложение»':'Use your browser menu to install the app');return}deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null})}
if(tg){tg.ready();tg.expand()}
if(profile){renderAll();document.getElementById('nav').classList.remove('hidden');show('home')}else startOnboarding(false)
</script>
