/* FOOD PLANNER APP — visual foundation v10 */
:root{
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#17231e;
  --muted:#6d7b74;
  --accent:#167a55;
  --accent2:#2aa876;
  --line:#e2e9e5;
  --soft:#e9f5ef;
  --ok:#2f9e69;
  --danger:#d85f68;
  --shadow:0 10px 35px rgba(24,55,43,.08);
}
html{background:var(--bg)}
body{
  background:
    radial-gradient(circle at 12% 0%,rgba(42,168,118,.10),transparent 30%),
    linear-gradient(180deg,#f7faf8 0%,var(--bg) 45%,#eef3f0 100%);
  color:var(--text);
  min-height:100vh;
}
.app{
  max-width:1040px;
  min-height:100vh;
  padding:24px 28px 110px;
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  margin:-24px -28px 22px;
  padding:18px 28px 16px;
  background:rgba(247,250,248,.86);
  border-bottom:1px solid rgba(226,233,229,.8);
  backdrop-filter:blur(18px);
}
.brand{
  font-size:21px;
  letter-spacing:-.02em;
}
.hello{font-size:13px;margin-top:4px}
.logo{
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 8px 20px rgba(22,122,85,.22);
}
.screen{animation:fpIn .18s ease}
@keyframes fpIn{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{
  padding:18px 0 26px;
  max-width:760px;
}
.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.18em}
.title{
  font-size:38px;
  line-height:1.05;
  letter-spacing:-.035em;
  margin:9px 0 11px;
}
.sub{font-size:15px;line-height:1.6}
.section{font-size:17px;margin:24px 2px 13px}
.grid{grid-template-columns:repeat(3,1fr);gap:14px}
.card,.choice{
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.card:hover,.choice:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 40px rgba(24,55,43,.12);
  border-color:#cfe0d8;
}
.card:active,.choice:active{transform:translateY(0)}
.card{min-height:145px}
.card.big{grid-column:span 2;min-height:145px}
.icon{font-size:26px}
.ct{font-size:17px;margin-top:11px}
.cm{font-size:13px;line-height:1.45}
.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 24px rgba(22,122,85,.20);
}
.secondary,.input{
  background:#fff;
  border-color:var(--line);
}
.info,.meal,.shopping,.store,.radius,.calmeal,.daytotal,.portionbox{
  border-color:var(--line)!important;
  box-shadow:0 8px 26px rgba(24,55,43,.06);
}
.meal{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin:12px 0;
}
.mealhead{font-size:13px;color:var(--muted)}
.dishname{font-size:18px;font-weight:900;letter-spacing:-.015em;margin-top:8px}
.portionbox{background:#f7faf8;border-radius:14px;padding:11px 13px;margin-top:12px;color:var(--muted);font-size:13px}
.calmeal{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#f3faf6;border:1px solid #dcefe6;border-radius:13px;padding:10px 12px;margin-top:12px;font-size:12px}
.kcal{font-weight:900;color:var(--accent)}
.daytotal{background:#17231e;color:#fff;border-radius:18px;padding:16px;font-weight:900;margin-top:14px}
.nav{
  left:50%;right:auto;bottom:18px;transform:translateX(-50%);
  width:min(720px,calc(100% - 32px));
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 16px 45px rgba(24,55,43,.14);
  backdrop-filter:blur(18px);
  overflow:hidden;
}
.navin{width:100%;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.nav button{border-radius:14px}
.nav button.active{background:var(--soft);color:var(--accent)}
.navico{font-size:19px}
.back{color:var(--accent);font-weight:850}
.footer{padding:26px 0 8px}
@media(max-width:760px){
  .app{max-width:680px;padding:16px 16px 105px}
  .top{margin:-16px -16px 18px;padding:15px 16px}
  .title{font-size:31px}
  .grid{grid-template-columns:1fr 1fr;gap:11px}
  .card{min-height:122px;padding:15px}
  .card.big{grid-column:1/-1;min-height:118px}
  .nav{bottom:10px;width:calc(100% - 20px)}
}
@media(min-width:761px){
  #home .hero{
    background:linear-gradient(135deg,#ffffff,#eef8f3);
    border:1px solid var(--line);
    border-radius:26px;
    padding:30px 32px;
    box-shadow:var(--shadow);
    margin-bottom:25px;
  }
  #home .section{margin-top:0}
  #today,#week,#shopping,#stores,#replace,#favorites,#ai,#nutrition,#calories{
    max-width:820px;margin:0 auto;
  }
}

/* v11 dashboard */
.homehero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:18px;align-items:stretch;margin-bottom:24px}
.welcome{background:linear-gradient(135deg,#126b4b,#2aa876);color:#fff;border-radius:28px;padding:28px;min-height:205px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 42px rgba(22,122,85,.18)}
.welcome .eyebrow{color:rgba(255,255,255,.72)}
.welcome .title{margin-top:12px;max-width:620px}
.welcome .sub{color:rgba(255,255,255,.82);max-width:620px}
.welcome .primary{width:auto;align-self:flex-start;background:#fff;color:#126b4b;box-shadow:none;padding:12px 16px;margin-top:18px}
.statcard{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}
.statlabel{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.statvalue{font-size:34px;font-weight:950;letter-spacing:-.04em;margin-top:8px}
.statmeta{font-size:13px;color:var(--muted);line-height:1.45;margin-top:5px}
.quickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 28px}
.quick{border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px;text-align:left;font-weight:850;box-shadow:0 7px 20px rgba(24,55,43,.05);transition:.15s}
.quick:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(24,55,43,.09)}
.quick span{display:block;font-size:21px;margin-bottom:8px}
.quick small{display:block;color:var(--muted);font-weight:600;margin-top:3px;font-size:11px}
.sectionline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sectionlink{border:0;background:transparent;color:var(--accent);font-weight:850;padding:4px}
@media(max-width:760px){.homehero{grid-template-columns:1fr}.welcome{min-height:230px}.quickgrid{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.app{padding-left:14px;padding-right:14px}.top{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}.title{font-size:31px}.welcome{padding:22px;border-radius:24px}.statcard{border-radius:24px}.quickgrid{gap:9px}.quick{padding:13px;border-radius:16px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">🥗 Food Planner</div><div class="hello" id="hello"></div></div><button class="langbtn" onclick="openLanguage()" id="langBtn">🌍 RU</button></div>

  <section id="home" class="screen active">
    <div class="homehero">
      <div class="welcome">
        <div><div class="eyebrow">FOOD PLANNER</div><div class="title" id="homeTitle"></div><p class="sub" id="homeSub"></p></div>
        <button class="primary" onclick="go('today')">📅 <span data-i18n="today"></span></button>
      </div>
      <div class="statcard">
        <div><div class="statlabel">Сегодня</div><div class="statvalue" id="homeMealCount">—</div><div class="statmeta" id="homeMealMeta">Твой план готовится…</div></div>
        <button class="secondary" onclick="go('week')">📆 <span data-i18n="week"></span></button>
      </div>
    </div>
    <div class="sectionline"><div class="section" id="mySection"></div><button class="sectionlink" onclick="go('profile')">⚙️ <span data-i18n="profile"></span></button></div>
    <div class="quickgrid">
      <button class="quick" onclick="go('shopping')"><span>🛒</span><span data-i18n="shopping"></span><small data-i18n="shoppingDesc"></small></button>
      <button class="quick" onclick="go('stores')"><span>📍</span><span data-i18n="stores"></span><small data-i18n="storesDesc"></small></button>
      <button class="quick" onclick="go('replace')"><span>🔄</span><span data-i18n="replace"></span><small data-i18n="replaceDesc"></small></button>
      <button class="quick" onclick="go('favorites')"><span>❤️</span><span data-i18n="favorites"></span><small data-i18n="favoritesDesc"></small></button>
    </div>
    <div class="grid">
      <button class="card" onclick="go('ai')"><div class="icon">🤖</div><div class="ct" data-i18n="ai"></div><div class="cm" data-i18n="aiDesc"></div></button>
      <button class="card" onclick="go('nutrition')"><div class="icon">📊</div><div class="ct" data-i18n="nutrition"></div><div class="cm" data-i18n="nutritionDesc"></div></button>
      <button class="card" onclick="go('calories')"><div class="icon">🧮</div><div class="ct" data-i18n="calories"></div><div class="cm" data-i18n="caloriesDesc"></div></button>
      <button class="card" onclick="go('profile')"><div class="icon">⚙️</div><div class="ct" data-i18n="profile"></div><div class="cm" data-i18n="profileDesc"></div></button>
    </div>
    <button class="primary" onclick="syncToBot()" data-i18n="saveBot"></button>
    <div class="footer" id="footer"></div>
  </section>

  <section id="today" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="today"></div><p class="sub" id="todaySub"></p><div id="todayMeals"></div></section>
  <section id="week" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="week"></div><p class="sub" id="weekSub"></p><div id="weekMeals"></div></section>
  <section id="shopping" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="shopping"></div><p class="sub" id="shoppingSub"></p><div class="shopping" id="shoppingList"></div></section>

  <section id="stores" class="screen">
    <button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="stores"></div><p class="sub" data-i18n="storesIntro"></p>
    <div class="pillrow" id="radiusRow"></div>
    <button class="primary" onclick="findStoresByLocation()" data-i18n="useLocation"></button>
    <div class="section" data-i18n="orAddress"></div>
    <input class="input" id="addressInput" data-i18n-placeholder="addressPlaceholder"><div class="addressguide" data-i18n="addressGuide"></div>
    <button class="secondary" onclick="findStoresByAddress()" data-i18n="searchAddress"></button>
    <div id="storeStatus" class="hint"></div><div id="storeResults"></div>
    <div class="mapnote">© OpenStreetMap contributors. Магазины показываются по открытым данным OpenStreetMap. Поиск выполняется только после вашего действия.</div>
  </section>

  <section id="replace" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="replace"></div><p class="sub" data-i18n="replaceIntro"></p><div id="replaceList"></div></section>
  <section id="favorites" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="favorites"></div><div id="favoritesList"></div></section>
  <section id="ai" class="screen"><button class="back" onclick="go('home')" data-i18n="back"></button><div class="title" data-i18n="ai"></div><div class="info" data-i18n="aiInfo"></div><div class="aihint" data-i18n="aiAppHint"></div><div id="aiMessages" class="aiex"></div><div class="aitop"><input id="aiInput" class="input" data-i18n-placeholder="aiPlaceholder"><button class="primary ai-send" onclick="askAiApp()" data-i18n="aiSend"></button></div></section>

function terms(s){const raw=norm(s);if(!raw||['нет','нету','не знаю','отсутствуют','нет аллергии','no','nee','nein'].includes(raw))return[];let out=[];for(const part of raw.split(/[,;]+/).map(x=>x.trim()).filter(Boolean)){for(const k in allergenMap){if(k.includes(part)||part.includes(k))out.push(...allergenMap[k])}if(part.length>=3)out.push(part.replace('аллергия','').replace('аллергию','').trim())}return [...new Set(out)]}
function allowed(d){const x=norm(d);if(terms(profile.allergies).some(v=>x.includes(v)))return false;const dislikes=norm(profile.dislikes);if(dislikes&&!['нет','нету','no','nee','nein'].includes(dislikes)){for(const i of dislikes.split(/[,;]+/).map(x=>x.trim()).filter(Boolean))if(i.length>=3&&x.includes(i))return false}const diet=norm(profile.diet);if(diet==='вегетарианское'&&['куриц','индейк','рыб','мяс','свин','говядин'].some(v=>x.includes(v)))return false;if(diet==='веганское'&&['куриц','индейк','рыб','мяс','свин','говядин','йогурт','творог','сыр','кефир','молок','яйц'].some(v=>x.includes(v)))return false;if(diet==='пескетарианское'&&['куриц','индейк','мяс','свин','говядин'].some(v=>x.includes(v)))return false;if(diet==='без мяса'&&['куриц','индейк','говядин','свин','мяс'].some(v=>x.includes(v)))return false;return true}

function prefAllowedDish(key,d){const prefs=profile?.mealPrefs?.[key]||[];const custom=profile?.mealPrefsCustom?.[key]||[];if(!prefs.length&&!custom.length)return true;const x=norm(d);const hit=prefs.some(pr=>(PREF_KEYWORDS[pr]||[]).some(k=>x.includes(norm(k))));if(hit)return true;return custom.some(text=>{const words=norm(text).split(/[^a-zа-я0-9]+/).filter(w=>w.length>=4);return words.some(w=>x.includes(w))})}
function ageScore(d){const a=Number(profile.age||30);const x=norm(d);if(a>=60){if(/омлет|рыб|картоф|чечевиц|греч|йогурт|творог|рис/.test(x))return 3;if(/макарон|бутерброд/.test(x))return 0}if(a<=12){if(/овсян|рис|греч|банан|йогурт|картоф|макарон/.test(x))return 3}if(a>=13&&a<=17){if(/овсян|греч|рис|куриц|рыб|чечевиц|овощ/.test(x))return 2}return 1}
function pick(arr,used,key){let options=arr.filter(x=>allowed(x)&&!used.has(x));if(!options.length)options=arr.filter(allowed);if(!options.length)return 'Подходящий вариант не найден';const preferred=options.filter(x=>prefAllowedDish(key,x));if(preferred.length)options=preferred;options.sort((a,b)=>ageScore(b)-ageScore(a));const top=options.slice(0,Math.min(3,options.length));return top[Math.floor(Math.random()*top.length)]}
function buildPlan(){const used=new Set();return (profile.meals||[]).map(key=>{const dish=pick(dishes[key]||[],used,key);used.add(dish);return {key,dish}})}

else if(s.type==='single'){html+='<div class="choices">';for(const [v,e,d] of s.options){const sel=profile[s.key]===v?' selected':'';html+=`<button class="choice${sel}" onclick="selectSingle('${s.key}',decodeURIComponent('${encodeURIComponent(v)}'))"><span class="emoji">${e}</span><span><b>${escapeHtml(v)}</b>${d?`<div class="desc">${escapeHtml(d)}</div>`:''}</span><span class="check">${sel?'✓':''}</span></button>`}html+='</div>';if(s.key==='budget'&&profile.budget==='Свой бюджет')html+=`<input id="customBudget" class="input" placeholder="${t('customBudget')}" value="${escapeHtml(profile.customBudget||'')}">`}
else if(s.type==='multi'){html+='<div class="choices">';for(const [v,e] of s.options){const sel=(profile.meals||[]).includes(v)?' selected':'';html+=`<button class="choice${sel}" onclick="toggleMeal('${v}')"><span class="emoji">${e}</span><span><b>${labelMeal(v)}</b></span><span class="check">${sel?'✓':''}</span></button>`}html+='</div>'}
else if(s.type==='mealPrefs'){title=t('prefsQ');sub=t('prefsSub');html='<div class="section">'+escapeHtml(t('prefsQ'))+'</div>';for(const key of (profile.meals||[])){const custom=profile.mealPrefsCustom?.[key]||[];html+=`<div class="section">${labelMeal(key)}</div><div class="prefgrid">`;for(const v of prefOptions(key)){const arr=profile.mealPrefs?.[key]||[];const sel=arr.includes(v);const img=PREF_IMAGES[v]||'';html+=`<button class="choice prefcard${sel?' selected':''}" onclick="togglePref('${key}',decodeURIComponent('${encodeURIComponent(v)}'))"><img src="${img}" alt="" loading="lazy" onerror="this.style.display='none'"><div class="prefbody"><span>${sel?'✓':'🍽️'}</span><b>${escapeHtml(v)}</b><span class="prefcheck">${sel?'✓':''}</span></div></button>`}html+=`</div><div class="custompref"><b>✏️ ${escapeHtml(t('customPrefsTitle'))}</b><div class="hint">${escapeHtml(t('customPrefHint'))}</div><div class="customrow"><input id="customPref-${key}" class="input" placeholder="${escapeHtml(t('customPrefPlaceholder'))}"><button class="smallbtn" onclick="addCustomPref('${key}')">${escapeHtml(t('addCustomPref'))}</button></div>${custom.map(x=>`<span class="customtag">✏️ ${escapeHtml(x)} <button class="smallbtn" style="padding:3px 6px;margin:0" onclick="removeCustomPref('${key}',decodeURIComponent('${encodeURIComponent(x)}'))">×</button></span>`).join('')}</div>`}}
else {html+=`<input id="textInput" class="input" placeholder="${s.key==='allergies'?t('allergiesSub'):t('dislikesQ')}" value="${escapeHtml(profile[s.key]||'')}">`;html+=`<button class="secondary" onclick="quickText('${s.key}','${encodeURIComponent(lang==='ru'?(s.key==='allergies'?t('noAllergy'):t('noDislike')):t(s.key==='allergies'?'noAllergy':'noDislike'))}')">${s.key==='allergies'?t('noAllergy'):t('noDislike')}</button>`}
html+=`<div class="actions">${step>0?'<button class="secondary" onclick="prevStep()">← '+t('back').replace('← ','')+'</button>':''}<button class="primary" onclick="nextStep()">${step===steps.length-1?t('done'):t('continue')}</button></div>`;document.getElementById('question').innerHTML=html}
function escapeHtml(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function selectSingle(k,v){profile[k]=v;if(k==='budget'&&v!=='Свой бюджет')profile.customBudget='';renderStep()}
function toggleMeal(v){profile.meals=profile.meals||[];profile.meals.includes(v)?profile.meals=profile.meals.filter(x=>x!==v):profile.meals.push(v);profile.mealPrefs=profile.mealPrefs||{};renderStep()}
function togglePref(k,v){profile.mealPrefs=profile.mealPrefs||{};profile.mealPrefs[k]=profile.mealPrefs[k]||[];profile.mealPrefs[k].includes(v)?profile.mealPrefs[k]=profile.mealPrefs[k].filter(x=>x!==v):profile.mealPrefs[k].push(v);renderStep()}
function addCustomPref(k){const el=document.getElementById('customPref-'+k);const v=(el?.value||'').trim();if(!v)return;profile.mealPrefsCustom=profile.mealPrefsCustom||{};profile.mealPrefsCustom[k]=profile.mealPrefsCustom[k]||[];if(!profile.mealPrefsCustom[k].includes(v))profile.mealPrefsCustom[k].push(v);saveProfile();toast(t('customPrefAdded'));renderStep()}
function removeCustomPref(k,v){profile.mealPrefsCustom=profile.mealPrefsCustom||{};profile.mealPrefsCustom[k]=(profile.mealPrefsCustom[k]||[]).filter(x=>x!==v);saveProfile();renderStep()}
function quickText(k,v){profile[k]=decodeURIComponent(v);renderStep()}
function nextStep(){const s=steps[step];if(s.type==='age'){const el=document.getElementById('ageInput');const value=Number(el?.value);if(!Number.isInteger(value)||value<6||value>120){toast(t('ageError'));return}profile.age=value}if(s.type==='text'){const el=document.getElementById('textInput');profile[s.key]=(el?.value||'').trim()||t(s.key==='allergies'?'noAllergy':'noDislike')}if(s.key==='budget'&&profile.budget==='Свой бюджет'){const el=document.getElementById('customBudget');profile.customBudget=(el?.value||'').trim()||t('budgetOwn')}if(s.type==='single'&&!profile[s.key]){toast(t('choose'));return}if(s.key==='meals'&&(!profile.meals||!profile.meals.length)){toast(t('mealRequired'));return}if(editing){profile.updatedAt=new Date().toISOString();saveProfile();renderAll();show('profile');document.getElementById('nav').classList.remove('hidden');toast(t('profileEditDone'));return}if(step<steps.length-1){step++;renderStep();return}finishProfile()}
function prevStep(){if(step>0){step--;renderStep()}}
function finishProfile(){profile.language=lang;if(!profile.meals||!profile.meals.length){toast(t('mealRequired'));return}profile.plan=buildPlan();profile.updatedAt=new Date().toISOString();saveProfile();editing=false;renderAll();show('home');document.getElementById('nav').classList.remove('hidden');toast(t('saved'))}
function updateHomeSummary(){const el=document.getElementById('homeMealCount');const meta=document.getElementById('homeMealMeta');if(!el||!meta)return;const n=Array.isArray(profile?.plan)?profile.plan.length:0;el.textContent=n?n:'—';meta.textContent=n?(n===1?'Приём пищи запланирован':`Приёмов пищи сегодня: ${n}`):'Сначала составь свой рацион';}
function renderAll(){const name=tg?.initDataUnsafe?.user?.first_name;document.getElementById('hello').textContent=name?name+' 👋':t('hello');document.getElementById('homeTitle').textContent=name?(lang==='ru'?'Готово, ':'Ready, ')+name+'!':t('homeTitle');document.getElementById('homeSub').textContent=t('homeSub');document.getElementById('mySection').textContent=t('mySection');document.getElementById('footer').textContent=t('footer');document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.getAttribute('data-i18n');el.textContent=t(key)});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.getAttribute('data-i18n-placeholder')));document.getElementById('langBtn').textContent='🌍 '+I18N[lang].code;document.getElementById('profileSummary')?.remove();renderToday();renderWeek();renderShopping();renderReplace();renderFavorites();renderRadius();renderCalories();renderProfile();updateHomeSummary();}
function renderToday(){if(!profile?.plan?.length){document.getElementById('todayMeals').innerHTML=`<div class="info">${t('noPlan')}</div>`;return}document.getElementById('todaySub').textContent=t('todaySub');const adult=Number(profile.age||0)>=18;let total=0;const cards=profile.plan.map((x,i)=>{const kcal=dishKcal(x.dish);if(adult)total+=kcal;return `<div class="meal"><div class="mealhead"><span>${labels[x.key]?.[0]||''} ${labelMeal(x.key)}</span><span class="badge">${i===0?'':labelMeal(x.key)}</span></div><div class="dishname">${escapeHtml(dishText(x.dish))}</div>${adult&&kcal?`<div class="calmeal"><span>🔥 Калорийность блюда</span><span class="kcal">≈ ${kcal} ккал</span></div>`:''}<div class="portionbox"><b>⚖️ ${t('portion')}</b><br>${escapeHtml(portions[x.dish]||'—')}</div><button class="smallbtn" onclick="toggleFavorite(${i})">♡</button><button class="smallbtn" onclick="replaceDish(${i})">🔄</button></div>`}).join('');document.getElementById('todayMeals').innerHTML=cards+(adult?`<div class="daytotal">🔥 Итого за день: ≈ ${total} ккал</div>`:'')}
function renderWeek(){document.getElementById('weekSub').textContent=t('weekSub');if(!profile?.meals?.length){document.getElementById('weekMeals').innerHTML=`<div class="info">${t('noPlan')}</div>`;return}let html='';const days=lang==='ru'?['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье']:lang==='en'?['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:lang==='nl'?['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag']:['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];const used=[];for(let day=0;day<7;day++){html+=`<div class="weekday">${days[day]}</div><div class="meal">`;for(const key of profile.meals||[]){let opts=(dishes[key]||[]).filter(allowed).filter(x=>!used.slice(-3).includes(x));if(!opts.length)opts=(dishes[key]||[]).filter(allowed);const dish=opts.length?opts[(day+key.length+Number(profile.age||0))%opts.length]:'Подходящий вариант не найден';used.push(dish);html+=`${labels[key][0]} ${labelMeal(key)} · ${escapeHtml(dishText(dish))}<br>`}html+='</div>'}document.getElementById('weekMeals').innerHTML=html}
function renderShopping(){document.getElementById('shoppingSub').textContent=t('shoppingSub');const map={'овсянка':'Овсянка','банан':'Бананы','ягод':'Ягоды','греч':'Гречка','фрукт':'Фрукты','яблок':'Яблоки','авокад':'Авокадо','овощ':'Овощи','йогурт':'Йогурт','творог':'Творог','рис':'Рис','сыр':'Сыр','орех':'Орехи','хлеб':'Хлеб','хлебц':'Хлебцы','куриц':'Курица','рыб':'Рыба','макарон':'Макароны','чечевиц':'Чечевица','картоф':'Картофель','индейк':'Индейка','булгур':'Булгур','нут':'Нут','фасол':'Фасоль','кефир':'Кефир','хумус':'Хумус','яйц':'Яйца'};let found=[];for(const x of profile?.plan||[]){const d=norm(x.dish);for(const k in map)if(d.includes(k)&&!found.includes(map[k]))found.push(map[k])}document.getElementById('shoppingList').innerHTML=found.length?found.map(x=>`<div class="item"><span class="box"></span>${escapeHtml(x)}</div>`).join(''):`<div class="item">${t('noPlan')}</div>`}
function renderReplace(){document.getElementById('replaceList').innerHTML=(profile?.plan||[]).map((x,i)=>`<div class="meal"><div class="mealhead"><span>${labels[x.key][0]} ${labelMeal(x.key)}</span></div><div class="dishname">${escapeHtml(dishText(x.dish))}</div><button class="smallbtn" onclick="replaceDish(${i})">🔄</button></div>`).join('')}
function replaceDish(i){const x=profile.plan[i];const options=(dishes[x.key]||[]).filter(allowed).filter(d=>d!==x.dish);if(!options.length){toast(t('noReplace'));return}profile.plan[i]= {key:x.key,dish:options[Math.floor(Math.random()*options.length)]};saveProfile();renderAll();toast(t('replaceDone'))}
function toggleFavorite(i){const fav=loadFav();const d=profile.plan[i].dish;if(!fav.includes(d))fav.push(d);else fav.splice(fav.indexOf(d),1);saveFav(fav);renderFavorites();toast(lang==='ru'?'Избранное обновлено':'Favorites updated')}
function renderFavorites(){const fav=loadFav();document.getElementById('favoritesList').innerHTML=fav.length?fav.map((x,i)=>`<div class="meal"><div class="dishname">❤️ ${escapeHtml(dishText(x))}</div><button class="smallbtn" onclick="removeFav(${i})">${t('remove')}</button></div>`).join(''):`<div class="info">${t('noFav')}</div>`}
function removeFav(i){const a=loadFav();a.splice(i,1);saveFav(a);renderFavorites()}
function renderRadius(){document.getElementById('radiusRow').innerHTML=[1,2,5,10].map(x=>`<button class="pill ${radius===x?'active':''}" onclick="setRadius(${x})">${x} ${t('km')}</button>`).join('')}
function setRadius(x){radius=x;renderRadius()}
async function findStoresByLocation(){
  const use=(lat,lon)=>findStores(Number(lat),Number(lon));
  if(tg?.LocationManager){
    try{
      const lm=tg.LocationManager;
      lm.init(()=>{
        if(lm.isLocationAvailable){
          lm.getLocation(loc=>{if(loc)use(loc.latitude,loc.longitude);else toast(t('locationDenied'))});
        }else if(navigator.geolocation){
          navigator.geolocation.getCurrentPosition(pos=>use(pos.coords.latitude,pos.coords.longitude),()=>toast(t('locationDenied')),{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
        }else toast(t('locationDenied'));
      });
      return;
    }catch(e){}
  }
  if(!navigator.geolocation){toast(t('locationDenied'));return}
  navigator.geolocation.getCurrentPosition(pos=>use(pos.coords.latitude,pos.coords.longitude),()=>toast(t('locationDenied')),{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
}
async function fetchJson(url,timeoutMs=12000){
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{const r=await fetch(url,{signal:controller.signal,headers:{'Accept':'application/json'}}); if(!r.ok)throw new Error(String(r.status)); return await r.json();}
  finally{clearTimeout(timer)}
}
async function geocodeAddress(q){if(!window.fpApi)throw new Error('API unavailable');const d=await fpApi('/api/geocode?q='+encodeURIComponent(q));if(d?.lat!=null&&d?.lon!=null)return [Number(d.lat),Number(d.lon)];return null}
async function findStoresByAddress(){const q=document.getElementById('addressInput').value.trim();if(!q){toast(t('addressError'));return}setStoreStatus(t('finding'));document.getElementById('storeResults').innerHTML='';try{const coords=await geocodeAddress(q);if(!coords){toast(t('addressError'));setStoreStatus('');return}await findStores(coords[0],coords[1]);}catch(e){setStoreStatus(t('osmError'));toast(t('osmError'))}}
const storeCache=new Map();
async function findStores(lat,lon){lat=Number(lat);lon=Number(lon);if(!Number.isFinite(lat)||!Number.isFinite(lon)){toast(t('locationDenied'));return}const cacheKey=[lat.toFixed(4),lon.toFixed(4),radius].join(':');const cached=storeCache.get(cacheKey);if(cached&&Date.now()-cached.time<300000){renderStores(cached.stores,lat,lon);return}setStoreStatus(t('finding'));document.getElementById('storeResults').innerHTML='';try{const d=await fpApi('/api/stores?lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon)+'&radius='+encodeURIComponent(radius));const stores=Array.isArray(d?.stores)?d.stores:[];storeCache.set(cacheKey,{time:Date.now(),stores});renderStores(stores,lat,lon);}catch(e){setStoreStatus(t('osmError'));toast(t('osmError'));console.warn('store search failed',e)}}
function setStoreStatus(x){document.getElementById('storeStatus').textContent=x}
function openLanguage(){show('language');document.getElementById('nav').classList.add('hidden');document.getElementById('languageChoices').innerHTML=LANG_NAMES.map(([k,n])=>`<button class="choice ${lang===k?'selected':''}" onclick="setLanguage('${k}')"><span class="emoji">${n.split(' ')[0]}</span><span><b>${n.substring(n.indexOf(' ')+1)}</b></span><span class="check">${lang===k?'✓':''}</span></button>`).join('')}

function renderCalories(){const age=Number(profile?.age||0);const f=document.getElementById('calorieForm');const r=document.getElementById('calorieResult');if(!f)return;if(age&&age<18){f.innerHTML=`<div class="info">${t('caloriesMinor')}<div class="ageedit"><b>${t('changeAge')}</b><div class="ageeditrow"><input id="ageEditInput" class="input" type="number" min="6" max="120" inputmode="numeric" value="${escapeHtml(age)}"><button class="smallbtn" onclick="saveAgeOnly()">${t('updated')}</button></div></div></div>`;r.innerHTML='';return}f.innerHTML=`<input id="cSex" class="input" placeholder="${t('sexPlaceholder')}"><input id="cWeight" class="input" type="number" min="30" max="300" placeholder="${t('weightPlaceholder')}"><input id="cHeight" class="input" type="number" min="120" max="230" placeholder="${t('heightPlaceholder')}"><select id="cActivity" class="input"><option value="1.2">${t('actLow')}</option><option value="1.375">${t('actLight')}</option><option value="1.55">${t('actModerate')}</option><option value="1.725">${t('actHigh')}</option><option value="1.9">${t('actVeryHigh')}</option></select><button class="primary" onclick="calculateCalories()">${t('calcCalories')}</button><div class="hint">${t('calorieDisclaimer')}</div><div class="ageedit"><b>${t('changeAge')}</b><div class="ageeditrow"><input id="ageEditInput" class="input" type="number" min="6" max="120" value="${escapeHtml(age||'')}"><button class="smallbtn" onclick="saveAgeOnly()">${t('updated')}</button></div></div>`}
function saveAgeOnly(){const el=document.getElementById('ageEditInput');const value=Number(el?.value);if(!Number.isInteger(value)||value<6||value>120){toast(t('ageError'));return}profile.age=value;profile.language=lang;saveProfile();renderAll();toast(t('updated'))}
function calculateCalories(){const age=Number(profile?.age||0);if(!age||age<18){renderCalories();return}const sex=(document.getElementById('cSex').value||'').toLowerCase();const w=Number(document.getElementById('cWeight').value),h=Number(document.getElementById('cHeight').value),a=Number(document.getElementById('cActivity').value);if(!w||!h||!a||!['м','ж','m','f','male','female'].some(x=>sex.startsWith(x))){toast(t('calorieInputError'));return}const bmr=(sex.startsWith('м')||sex.startsWith('m'))?(10*w+6.25*h-5*age+5):(10*w+6.25*h-5*age-161);const total=Math.round(bmr*a);document.getElementById('calorieResult').innerHTML=`<div class="meal"><div class="dishname">${t('calorieResult')}</div><div class="title" style="font-size:28px">≈ ${total} kcal/day</div><div class="hint">${t('calorieResultNote')}</div></div>`}

function setLanguage(k){lang=k;profile=profile||{};profile.language=lang;saveProfile();renderAll();document.getElementById('nav').classList.remove('hidden');go('home')}
function go(id){if(!profile&&id!=='onboarding'&&id!=='language'){startOnboarding();return}if(id==='profile')renderProfile();document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const n=document.getElementById('n-'+id);if(n)n.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function syncToBot(){if(!profile?.plan?.length){toast(t('noPlan'));return}profile.language=lang;saveProfile();profile.mealPrefsCustom=profile.mealPrefsCustom||{};send('save_profile',profile)}
function send(action,data){if(tg){tg.sendData(JSON.stringify({action,...(data?{profile:data}:{})}));}else toast('Open inside Telegram')}
async function askAiApp(){const el=document.getElementById('aiInput');const q=(el?.value||'').trim();if(!q)return;const box=document.getElementById('aiMessages');box.insertAdjacentHTML('beforeend',`<div class="aimsg user">${escapeHtml(q)}</div>`);el.value='';box.insertAdjacentHTML('beforeend',`<div id="aiThinking" class="aimsg bot">${escapeHtml(t('aiThinking'))}</div>`);try{const d=await fpApi('/api/ai',{method:'POST',body:JSON.stringify({message:q,profile:profile||{}})});document.getElementById('aiThinking')?.remove();box.insertAdjacentHTML('beforeend',`<div class="aimsg bot">${escapeHtml(d?.answer||t('aiError'))}</div>`);}catch(e){document.getElementById('aiThinking')?.remove();box.insertAdjacentHTML('beforeend',`<div class="aimsg bot">${escapeHtml(t('aiError'))}</div>`)}}
function toast(x){const el=document.getElementById('toast');el.textContent=x;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}

</script>
<script>

/* FOOD PLANNER CORE — persistent API bridge */
(function(){
  const API=(window.FOOD_API_URL||'').replace(/\/$/,'');
  const KEY='food_planner_device_id_v1';
  let deviceId=localStorage.getItem(KEY);
  if(!deviceId){
    deviceId=(crypto.randomUUID?crypto.randomUUID():('fp-'+Date.now()+'-'+Math.random().toString(36).slice(2)));
    localStorage.setItem(KEY,deviceId);
  }
  window.fpApi=function(path,opts){
    if(!API)return Promise.resolve(null);
    opts=opts||{};
    const headers=Object.assign({'Content-Type':'application/json','X-Device-ID':deviceId},opts.headers||{});
    return fetch(API+path,Object.assign({},opts,{headers:headers})).then(r=>{
      if(!r.ok)throw new Error('API '+r.status);
      return r.status===204?null:r.json();
    });
  };
  window.fpLoadCloud=async function(){
    if(!API)return;
    try{
      const d=await fpApi('/api/state');
      if(d&&d.profile){
        profile=d.profile;
        lang=profile.language||lang;
        localStorage.setItem(STORAGE,JSON.stringify(profile));
      }
      if(d&&Array.isArray(d.favorites)){
        localStorage.setItem(FAVORITES,JSON.stringify(d.favorites));
      }
    }catch(e){console.warn('Food Planner API unavailable; local data kept',e)}
  };
  const oldSaveProfile=window.saveProfile;
  window.saveProfile=function(){
    oldSaveProfile();
    if(API&&profile){
      fpApi('/api/profile',{method:'PUT',body:JSON.stringify({profile:profile})})
        .catch(e=>console.warn('Profile sync failed',e));
    }
  };
  const oldSaveFav=window.saveFav;
  window.saveFav=function(a){
    oldSaveFav(a);
    if(API)fpApi('/api/favorites',{method:'PUT',body:JSON.stringify({favorites:a})})
      .catch(e=>console.warn('Favorites sync failed',e));
  };
  const oldSend=window.send;
  window.send=function(action,data){
    if(action==='save_profile'&&API&&data){
      fpApi('/api/profile',{method:'PUT',body:JSON.stringify({profile:data})})
        .then(()=>toast('Данные сохранены ☁️'))
        .catch(()=>toast('Локально сохранено'));
      if(tg)tg.sendData(JSON.stringify({action:'save_profile',profile:data}));
      return;
    }
    return oldSend(action,data);
  };
  window.fpBoot=function(){
    fpLoadCloud().finally(function(){
      if(tg){tg.ready();tg.expand()}
      if(profile){renderAll();document.getElementById('nav').classList.remove('hidden');show('home')}
      else startOnboarding(false);
    });
  };
})();

fpBoot();
</script>
